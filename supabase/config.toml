project_id = "aura-beauty"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true

# Public entry point: protection is enforced by CAPTCHA, DB quotas and capability checks.
[functions.booking-gateway]
verify_jwt = false

# GET serves published images; every write verifies Auth getUser + private.admin_users.
[functions.site-media]
verify_jwt = false
static_files = ["./functions/site-media/vendor/magick.wasm"]
